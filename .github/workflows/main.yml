
name: Build Polyglot AI Keyboard APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          test -n "$ZIP" || { echo "ZIP not found"; exit 1; }
          mkdir -p project
          unzip -oq "$ZIP" -d project
          ANDROID_DIR=$(find project -type f -name settings.gradle.kts -print -quit | xargs dirname)
          test -d "$ANDROID_DIR/app" || { echo "Android project not found"; exit 1; }
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Fix Android plugin repositories
        run: |
          cat > "$ANDROID_DIR/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PolyglotAIKeyboard"
          include(":app")
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          gradle -p "$ANDROID_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Polyglot-AI-Keyboard-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
